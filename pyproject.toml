[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "timm"
authors = [
    {name = "Ross Wightman", email = "ross@huggingface.co"},
]
description = "PyTorch Image Models"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["pytorch", "image-classification"]
license = {text = "Apache-2.0"}
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Intended Audience :: Education',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: Apache Software License',
        'Programming Language :: Python :: 3.8',
        'Programming Language :: Python :: 3.9',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Topic :: Scientific/Engineering',
        'Topic :: Scientific/Engineering :: Artificial Intelligence',
        'Topic :: Software Development',
        'Topic :: Software Development :: Libraries',
        'Topic :: Software Development :: Libraries :: Python Modules',
]
dependencies = [
        'torch',
        'torchvision',
        'pyyaml',
        'huggingface_hub',
        'safetensors',
        "datasets>=3.1.0",
        "pyarrow>=17.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
# Extra libraries used by the experimentation scripts in kytest/ and by timm/data/npaug.py
# (data augmentation, background removal, ONNX/NCNN export). NOT needed for core timm — npaug
# imports albumentations/cv2 lazily. Require Python >= 3.10 (modern rembg/albumentations/
# onnxruntime drop 3.9), hence the markers.
#
# NOTE: a clean `uv lock`/`uv sync --extra kytest` can conflict — rembg pulls CPU `onnxruntime`
# while we want `onnxruntime-gpu`, and onnxruntime-gpu additionally needs matching CUDA 12 + cuDNN 9
# libs (installed separately as nvidia-*-cu12 wheels). The tested install path is direct:
#   uv pip install "albumentations>=2.0" opencv-python-headless "rembg>=2.0.69" \
#                  "onnxruntime-gpu>=1.17,<1.20" "onnx>=1.16" ncnn \
#                  nvidia-cudnn-cu12 nvidia-cublas-cu12 nvidia-cufft-cu12 nvidia-curand-cu12 \
#                  nvidia-cuda-runtime-cu12 nvidia-cuda-nvrtc-cu12
kytest = [
    "albumentations>=2.0 ; python_version >= '3.10'",
    "opencv-python-headless>=4.10 ; python_version >= '3.10'",
    "rembg>=2.0.69 ; python_version >= '3.10'",
    "onnxruntime-gpu>=1.17,<1.20 ; python_version >= '3.10'",
    "onnx>=1.16 ; python_version >= '3.10'",
    "ncnn ; python_version >= '3.10'",
]

[project.urls]
homepage = "https://github.com/huggingface/pytorch-image-models"
documentation = "https://huggingface.co/docs/timm/en/index"
repository = "https://github.com/huggingface/pytorch-image-models"

[tool.pdm.dev-dependencies]
test = [
        'pytest',
        'pytest-timeout',
        'pytest-xdist',
        'pytest-forked',
        'expecttest',
]

[tool.pdm.version]
source = "file"
path = "timm/version.py"

[tool.pytest.ini_options]
testpaths = ['tests']
markers = [
    "base: marker for model tests using the basic setup",
    "cfg: marker for model tests checking the config",
    "torchscript: marker for model tests using torchscript",
    "features: marker for model tests checking feature extraction",
    "fxforward: marker for model tests using torch fx (only forward)",
    "fxbackward: marker for model tests using torch fx (only backward)",
]

[tool.wruff.format]
quote-style = "preserve"
preview = true

